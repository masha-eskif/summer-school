<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта-тренажёр улиц · Долгопрудный (по районам)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0f1419;--panel:#171e25;--card:#1f2831;--accent:#4fa3ff;--text:#e7edf3;
    --muted:#8a99a8;--ok:#3ddc97;--err:#ff6b6b;--border:#2c3742;--hi:#ff2d55;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:7px 12px;text-align:center;border-bottom:1px solid var(--border);flex:0 0 auto}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:11px}
  .tabs{display:flex;gap:6px;padding:7px 10px 4px;flex:0 0 auto}
  .tab{flex:1;padding:8px;border:1px solid var(--border);background:var(--card);color:var(--text);
    border-radius:9px;cursor:pointer;font-size:13px;text-align:center}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
  #chips{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;flex:0 0 auto;white-space:nowrap}
  .chip{flex:0 0 auto;padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);
    background:var(--card);color:var(--text);display:flex;align-items:center;gap:6px}
  .chip .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .chip.active{outline:2px solid var(--accent);font-weight:700}
  #map{flex:1 1 auto;min-height:220px;background:#dfe7ec}
  .leaflet-container{background:#dfe7ec}
  #controls{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--border);padding:11px 14px;min-height:92px}
  .prompt{font-size:15px;text-align:center;margin-bottom:9px;min-height:21px}
  .prompt b{color:#ffd43b}
  .big{font-size:19px;font-weight:700;color:#ffd43b}
  .dchip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;color:#06121f;font-weight:700;margin-left:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button.act{flex:1;min-width:88px;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
  .b-reveal{background:var(--card);color:var(--accent);border:1px solid var(--border)}
  .b-no{background:#3a2730;color:var(--err)}.b-yes{background:#1f3a30;color:var(--ok)}.b-next{background:var(--accent);color:#06121f}
  .opt{display:block;width:100%;text-align:left;padding:10px 13px;margin-bottom:6px;border:1px solid var(--border);
    background:var(--card);color:var(--text);border-radius:9px;cursor:pointer;font-size:14px}
  .opt:hover{background:#26313b}.opt.correct{background:#1f3a30;border-color:var(--ok)}.opt.wrong{background:#3a2730;border-color:var(--err)}
  .opt:disabled{cursor:default}
  .stat{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗺️ Долгопрудный · улицы по районам</h1>

  </header>
  <div class="tabs">

    <div class="tab" data-mode="quiz">❓ Викторина</div>
  </div>
  <div id="chips"></div>
  <div id="map"></div>
  <div id="controls"></div>
</div>

/* улицы */
const layers={}; // name -> {poly, d, c}
GEO.streets.forEach(st=>{
  const arr=[];
  st.s.forEach(seg=>{const pl=L.polyline(seg.map(p=>[p[0],p[1]]),{color:st.c,weight:3,opacity:.85});
    pl.on('click',()=>onClick(st.n));pl.addTo(map);arr.push(pl);});
  layers[st.n]={poly:arr,d:st.d,c:st.c};
});
const ALL=GEO.streets.map(s=>s.n);
let filter=null; // выбранный район или null=все
function pool(){return filter?ALL.filter(n=>layers[n].d===filter):ALL;}

function baseStyle(n){const L1=layers[n];const dim=filter&&L1.d!==filter;
  L1.poly.forEach(p=>p.setStyle({color:L1.c,weight:dim?1.5:3,opacity:dim?.25:.85}));}
function styleAllBase(){for(const n in layers)baseStyle(n);}
function dimAll(){for(const n in layers)layers[n].poly.forEach(p=>p.setStyle({color:layers[n].c,weight:1.5,opacity:.22}));}
function boundsOf(n){let b=L.latLngBounds([]);layers[n].poly.forEach(p=>b.extend(p.getBounds()));return b;}
function focus(n,fit){ (mode==='explore'?styleAllBase:dimAll)();
  layers[n].poly.forEach(p=>{p.setStyle({color:'#ff2d55',weight:8,opacity:1});p.bringToFront();});
  if(fit){const b=boundsOf(n);if(b.isValid())map.fitBounds(b.pad(.6),{maxZoom:16});}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(arr,n,ex){return shuffle(arr.filter(x=>x!==ex)).slice(0,n);}
function dchip(d){return `<span class="dchip" style="background:${PAL[d]}">${d}</span>`;}

/* чипы районов */
function renderChips(){
  const box=document.getElementById('chips');box.innerHTML='';
  const counts={};ALL.forEach(n=>counts[layers[n].d]=(counts[layers[n].d]||0)+1);
  const mk=(label,d,color)=>{const c=document.createElement('div');c.className='chip'+((filter===d)?' active':'');
    c.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:'')+label;
    c.onclick=()=>{filter=d;renderChips();afterFilter();};box.appendChild(c);};
  mk(`Все (${ALL.length})`,null,null);
  Object.keys(PAL).forEach(d=>{if(counts[d])mk(`${d} (${counts[d]})`,d,PAL[d]);});
}
function afterFilter(){
  if(mode==='explore'){styleAllBase();renderExplore();}
  if(mode==='cards')startCards();
  if(mode==='quiz')nextQuiz();
}

/* режимы */
let mode='explore';
const ctl=document.getElementById('controls');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');mode=t.dataset.mode;
  if(mode==='explore'){styleAllBase();renderExplore();}
  if(mode==='cards'){startCards();}
  if(mode==='quiz'){nextQuiz();}
});

function onClick(n){if(mode==='explore'){focus(n,false);
  document.getElementById('exName').innerHTML='<b>'+n+'</b>'+dchip(layers[n].d);}}
function renderExplore(){styleAllBase();
  ctl.innerHTML=`<div class="prompt" id="exName">Нажми на улицу${filter?(' района «'+filter+'»'):''}</div>
    <div class="stat">${filter?('Район: '+filter+' · '+pool().length+' улиц'):('Всего улиц: '+ALL.length+' · выбери район для тренировки')}</div>`;}

/* карточки */
let deck=[],di=0;
function startCards(){deck=shuffle(pool());di=0;showCard();}
function showCard(){
  if(!deck.length){ctl.innerHTML='<div class="prompt">Пусто. Выбери район.</div>';return;}
  if(di>=deck.length){ctl.innerHTML=`<div class="prompt">🎉 Пройдено!</div><div class="row"><button class="act b-next" onclick="startCards()">Заново</button></div>`;dimAll();return;}
  const n=deck[di];focus(n,true);
  const done=pool().filter(x=>store.known[x]).length;
  ctl.innerHTML=`<div class="prompt big" id="cardName">Что это за улица?</div>
    <div class="row" id="cardBtns"><button class="act b-reveal" id="rev">👁 Показать</button></div>
    <div class="stat">${di+1}/${deck.length}${filter?(' · '+filter):''} · выучено ${done}/${deck.length}</div>`;
  document.getElementById('rev').onclick=()=>{
    document.getElementById('cardName').innerHTML='<b>'+n+'</b>'+dchip(layers[n].d);
    document.getElementById('cardBtns').innerHTML=`<button class="act b-no" id="no">Не знал</button><button class="act b-yes" id="yes">Знал ✓</button>`;
    document.getElementById('yes').onclick=()=>{store.known[n]=1;persist();di++;showCard();};
    document.getElementById('no').onclick=()=>{delete store.known[n];persist();di++;showCard();};};
}
/* викторина */
let qS=0,qT=0;
function nextQuiz(){
  const P=pool();if(P.length<2){ctl.innerHTML='<div class="prompt">Мало улиц — выбери другой район.</div>';return;}
  const correct=P[Math.floor(Math.random()*P.length)];focus(correct,true);
  const distractPool=P.length>=4?P:ALL;
  const opts=shuffle([correct,...sample(distractPool,3,correct)]);
  ctl.innerHTML=`<div class="prompt">Какая улица подсвечена?${filter?'':' '+dchip(layers[correct].d)}</div><div id="opts"></div><div class="stat" id="qstat">Счёт: ${qS} / ${qT}</div>`;
  const box=document.getElementById('opts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>{qT++;if(o===correct){qS++;store.known[correct]=1;persist();}
      [...box.children].forEach(c=>{c.disabled=true;if(c.textContent===correct)c.classList.add('correct');});
      if(o!==correct)b.classList.add('wrong');
      document.getElementById('qstat').textContent=`Счёт: ${qS} / ${qT}`;
      const nb=document.createElement('button');nb.className='act b-next';nb.style.marginTop='8px';nb.textContent='Дальше →';nb.onclick=nextQuiz;box.appendChild(nb);};
    box.appendChild(b);});
}
renderChips();renderExplore();
</script>
